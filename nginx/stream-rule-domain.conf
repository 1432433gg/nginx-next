# 本机 {{PORT}} → {{TARGET}}:{{TARGET_PORT}}，TCP 和 UDP 都转发
# 后端是域名：每 60 秒重新解析一次，IP 变了会自动跟上
server {
    listen {{PORT}};
    listen {{PORT}} udp reuseport;
    proxy_connect_timeout 10s;
    resolver {{RESOLVERS}} valid=60s ipv6=off;
    resolver_timeout 5s;
    set $backend {{TARGET}}:{{TARGET_PORT}};
    proxy_pass $backend;
}
